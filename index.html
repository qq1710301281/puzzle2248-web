  <style>
    #NestLoading {
      position: fixed; inset: 0; z-index: 10; display: grid; place-content: center;
      justify-items: center; gap: 16px; text-align: center; color: #fff2d3;
      background: radial-gradient(ellipse at 50% 38%, #244b86, #151c42 65%);
      font: 700 16px sans-serif;
    }
    #NestProgress {
      width: min(72vw, 300px); height: 12px; border: 0; border-radius: 10px;
      overflow: hidden; background: #152350; accent-color: #7ff0d3;
    }
    #NestProgress::-webkit-progress-bar { background: #152350; }
    #NestProgress::-webkit-progress-value {
      background: linear-gradient(90deg, #49b7d0, #87efcc);
      border-radius: 10px;
    }
    #NestProgress::-moz-progress-bar {
      background: linear-gradient(90deg, #49b7d0, #87efcc); border-radius: 10px;
    }
    #NestPercent { font-size: 14px; font-variant-numeric: tabular-nums; color: #abf3e1; }
  </style>
</head>
<body>
  <div id="NestLoading">
    <span id="NestProgressLabel">正在进入小窝…</span>
    <progress id="NestProgress" aria-labelledby="NestProgressLabel" value="0" max="4"></progress>
    <span id="NestPercent" aria-hidden="true">0%</span>
  </div>
